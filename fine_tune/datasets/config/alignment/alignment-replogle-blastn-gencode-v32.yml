targets_paths:
  - fine_tune/datasets/anndata/raw_replogle/Target_Table_S1_merged.csv
targets_key_maps:
  - null
out_dir: fine_tune/datasets/alignment/replogle
gencode_version: 32
tool: blastn
aligner_kwargs: # full list: https://www.ncbi.nlm.nih.gov/books/NBK279684/ at [Table C1]
  -word_size: 12    # Length of initial exact match. (higher imply a speed-up but less granularity)
n_mismatch: 3
n_thread: 10
densify_gene_interval: true
split_holes_equally: true
keep_best_only: false
smallest_interval: false
cleanup: false